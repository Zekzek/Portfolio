# AWS Amplify build for zekzek.net. One Amplify app, one site per branch:
#   main      -> www.zekzek.net  (sites/portfolio; SITE unset)
#   deck-app  -> mtg.zekzek.net  (sites/mtg; branch env vars SITE=mtg, PUBLIC_DECKSITE_MODE=hosted)
# Tests run before the build, so a change that breaks a site's tests can't deploy.
# Needs the Amazon Linux 2023 build image (_CUSTOM_IMAGE=amplify:al2023) for Node 22.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        - echo "Building sites/${SITE:-portfolio}"
        - npm test -w "sites/${SITE:-portfolio}"
        - npm run build -w "sites/${SITE:-portfolio}"
        - rm -rf deploy && cp -r "sites/${SITE:-portfolio}/dist" deploy
  artifacts:
    baseDirectory: deploy
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
