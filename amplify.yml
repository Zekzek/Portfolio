# AWS Amplify build for www.zekzek.net (sites/portfolio).
# Tests run before the build, so a change that breaks the skill filters can't deploy.
# When the deck app (sites/mtg) gets its own Amplify app, switch this file to the
# monorepo format (applications: with appRoot) and set AMPLIFY_MONOREPO_APP_ROOT per app.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        - npm test
        - npm run build
  artifacts:
    baseDirectory: sites/portfolio/dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
