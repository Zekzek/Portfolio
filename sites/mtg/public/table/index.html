<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Table Cards</title>
<meta name="theme-color" content="#16181d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#16181d; --panel:#20232a; --panel2:#2a2e37; --text:#eceef2; --muted:#9aa1ad;
  --line:#353a45; --accent:#e04b8a; --accent-soft:#e04b8a33; --ok:#4caf7a;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f1ec; --panel:#ffffff; --panel2:#ece9e2; --text:#1d1f24; --muted:#636a75;
    --line:#d8d4ca; --accent:#c2185b; --accent-soft:#c2185b22; color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:0 12px calc(24px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
button:active{transform:translateY(1px)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:44px}
label{font-size:.82rem;color:var(--muted);display:block;margin-bottom:3px}
.wrap{max-width:560px;margin:0 auto}

/* search */
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
.searchrow{display:flex;gap:6px}
.searchrow input{font-size:1.05rem;padding:11px 12px}
#mic{flex:0 0 auto;width:48px;font-size:1.2rem;padding:0}
#mic.listening{background:var(--accent);border-color:var(--accent);color:#fff}
#suggest{list-style:none;margin:4px 0 0;padding:0;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;max-height:46vh;overflow:auto;display:none}
#suggest.open{display:block}
#suggest li button{display:block;width:100%;text-align:left;border:0;border-radius:0;background:none;padding:10px 12px;border-bottom:1px solid var(--line)}
#suggest li:last-child button{border-bottom:0}
#suggest li button small{color:var(--muted);margin-left:6px}
#status{min-height:1.2em;font-size:.85rem;color:var(--muted);margin-top:4px}
#status.err{color:#ff7a7a}

/* slots */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 10px}
.slot{position:relative;padding:4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.slot.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.slot canvas{width:100%;aspect-ratio:2/3;border-radius:6px;background:var(--panel)}
.slot span{font-size:.78rem;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot b{position:absolute;top:6px;left:8px;font-size:.8rem;background:var(--bg);border-radius:6px;padding:0 5px}

/* preview */
.preview{display:flex;justify-content:center;margin:4px 0 8px}
.preview canvas{width:min(100%,360px);height:auto;border-radius:10px;box-shadow:0 4px 18px #0006;background:var(--panel)}
.preview .empty{color:var(--muted);padding:60px 0;text-align:center}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--panel2)}
.seg button.on{background:var(--accent);color:#fff}
.bar select{width:auto;flex:1 1 150px}

/* overrides */
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600}
summary small{font-weight:400;color:var(--accent);margin-left:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.grid .full{grid-column:1/-1}
.pt{display:flex;gap:6px;align-items:center}
.pt input{text-align:center}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.colors button{width:40px;height:40px;border-radius:50%;padding:0;font-weight:700}
.colors button.on{outline:3px solid var(--accent);outline-offset:1px}
.check{display:flex;gap:8px;align-items:center;color:var(--text);font-size:.95rem}
.check input{width:auto}
.inline{display:flex;gap:6px}
.inline .seg{flex:0 0 auto}
.muted{color:var(--muted);font-size:.85rem}

/* fullscreen */
#full{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:20}
#full.open{display:flex}
#full canvas{max-width:100vw;max-height:100vh;width:auto;height:auto}
</style>
</head>
<body>
<div class="wrap">

  <div class="search">
    <div class="searchrow">
      <input id="q" type="search" placeholder="Card name, Scryfall search or link" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button id="mic" title="Say the card name" aria-label="Say the card name">🎤</button>
    </div>
    <ul id="suggest"></ul>
    <div id="status"></div>
  </div>

  <div class="slots" id="slots"></div>

  <div class="preview" id="preview"></div>

  <div class="bar">
    <div class="seg" id="viewSeg">
      <button data-view="image">Card image</button>
      <button data-view="text">Large text</button>
    </div>
    <button id="faceBtn" hidden>Flip face</button>
    <select id="target" title="Display this slot is shown on"></select>
  </div>
  <div class="bar">
    <button id="fullBtn">Full screen</button>
    <button id="sendBtn" class="primary" disabled title="Comes with the display hardware">Send to display</button>
    <select id="copyTo" title="Copy this slot to another">
      <option value="">Copy to…</option>
    </select>
    <button id="clearBtn">Clear</button>
  </div>

  <details id="ovBox" open>
    <summary>Copy exceptions <small id="ovSummary"></small></summary>
    <div class="grid">
      <div class="full">
        <label for="except">Except it's a…</label>
        <div class="inline">
          <input id="except" placeholder="4/4 black Zombie" autocomplete="off">
          <button id="exceptBtn">Apply</button>
        </div>
      </div>
      <div>
        <label>Power / toughness</label>
        <div class="pt"><input id="p" inputmode="numeric" placeholder="P"> / <input id="t" inputmode="numeric" placeholder="T"></div>
      </div>
      <div>
        <label>Colors <span class="muted">(tap to set)</span></label>
        <div class="colors" id="colors"></div>
      </div>
      <div class="full">
        <label for="subs">Subtypes</label>
        <div class="inline">
          <input id="subs" placeholder="Zombie" autocomplete="off">
          <div class="seg" id="subsMode"><button data-mode="replace">Replace</button><button data-mode="add">Add</button></div>
        </div>
      </div>
      <div class="full">
        <label for="types">Card types</label>
        <div class="inline">
          <input id="types" placeholder="Artifact Creature" autocomplete="off">
          <div class="seg" id="typesMode"><button data-mode="replace">Replace</button><button data-mode="add">Add</button></div>
        </div>
      </div>
      <div class="full">
        <label for="addText">Also has</label>
        <textarea id="addText" rows="2" placeholder="Flying"></textarea>
      </div>
      <div class="full">
        <label for="name">Name</label>
        <input id="name" placeholder="(unchanged)" autocomplete="off">
      </div>
      <label class="check"><input type="checkbox" id="notLegendary"> Not legendary</label>
      <label class="check"><input type="checkbox" id="token"> Token</label>
      <div class="full"><button id="ovReset">Reset exceptions</button></div>
    </div>
  </details>

  <p class="muted">Card data and images from <a href="https://scryfall.com" style="color:inherit">Scryfall</a>. Your phone talks to Scryfall directly; nothing is relayed.</p>
</div>

<div id="full"></div>

<script src="app.js"></script>
</body>
</html>
